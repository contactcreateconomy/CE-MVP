name: Convex prod deploy (manual)

# Bucket-1 guard (AGENTS.md §10): prod pushes must NEVER run automatically.
# This workflow only runs when a human clicks "Run workflow" and confirms.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROD-DEPLOY to confirm (flag to founder in PR/issue before running)"
        required: true
        default: ""

jobs:
  deploy:
    if: github.event.inputs.confirm == 'PROD-DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: convex-prod

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pre-deploy quality gates
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test:run
          node scripts/cap-coverage.mjs

      - name: Deploy Convex to production
        run: pnpm convex:deploy:prod
        env:
          CONVEX_DEPLOY_TOKEN: ${{ secrets.CONVEX_DEPLOY_TOKEN }}

      # NOTE: AGENTS.md §7 lists `pnpm convex:prod:ensure-categories`, but that
      # script does not exist in package.json. If a prod category check is
      # needed, add the script first, then re-enable a step here.
