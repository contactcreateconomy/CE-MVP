name: Wiki tracker sync

# D-006 (LOCKED 2026-09-29): the GitHub wiki is a read-only archive of the PRD
# build; progress lives in ak-redesign/00-control/STATUS.md. This workflow now
# only reminds on a merged PR that didn't touch CHANGELOG.md (AGENTS.md §11).
# File name kept so existing branch-protection/history references still resolve.

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  changelog-reminder:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && !contains(join(github.event.pull_request.labels.*.name, ','), 'no-changelog')
    steps:
      - name: Remind on CHANGELOG (PR merged without changelog change)
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          if ! echo "$FILES" | grep -q '^CHANGELOG.md$'; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "⚠️ Definition of done (AGENTS.md §11): merged without a CHANGELOG.md entry — please add one or apply the \`no-changelog\` label."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
