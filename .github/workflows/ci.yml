name: CI

on:
  pull_request:
    branches: [001-default, main]
  push:
    branches: [001-default]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build · Cap-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # pnpm version is pinned via packageManager in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

      - name: Convex unit tests
        run: pnpm test:convex

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E (smoke + always-on gates; pipeline quarantined)
        run: pnpm test:e2e

      - name: Dependency audit (production deps, fail on high/critical)
        run: pnpm audit --prod --audit-level high
        # 2026-09-13: prod tree clean after next@16.3.3 + @auth/core@0.41.3
        # upgrades. Dev-only advisories are not gated here — Dependabot
        # tracks them via grouped minor/patch PRs.

      - name: Capability coverage gate (572/572 expected)
        run: node scripts/cap-coverage.mjs

      - name: Build
        run: pnpm build
        # No NEXT_PUBLIC_CONVEX_URL: the codebase guards prerenders with
        # isConvexConfigured() exactly for CI/Vercel builds without Convex.
