# Dependabot — dependency + GitHub Actions updates.
# pnpm workspace: the root lockfile covers all packages, so one `npm` entry
# with directory: "/" is sufficient (sub-packages share pnpm-lock.yaml).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Convex is pinned to 1.34.1 via pnpm override — do not let Dependabot
    # drift it. Review major bumps of next/react manually.
    ignore:
      - dependency-name: "convex"
    groups:
      # Batch dev-dep minor/patch bumps into one PR to cut noise.
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies"]
